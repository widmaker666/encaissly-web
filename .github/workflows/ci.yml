name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux : le workflow ne peut que lire le code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par SHA (v6.0.2 / v6.4.0) : un tag peut être déplacé, pas un SHA
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : pas d'exécution de scripts d'installation de dépendances
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
