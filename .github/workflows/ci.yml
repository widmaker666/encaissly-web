name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux : le workflow ne peut que lire le code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par SHA (v6.0.2 / v6.4.0) : un tag peut être déplacé, pas un SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : pas d'exécution de scripts d'installation de dépendances
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
