version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    # Limite à 0 : plus de mises à jour de version normales.
    # Les correctifs de sécurité (alertes Dependabot) continuent d'arriver, groupés ci-dessous.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # Une seule PR pour tous les correctifs de sécurité
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
