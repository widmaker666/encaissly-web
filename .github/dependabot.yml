version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # Délai avant de proposer une release fraîche (protège contre un paquet compromis
    # publié puis retiré). Ne s'applique pas aux correctifs de sécurité.
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # Une seule PR pour toutes les mises à jour minor/patch
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Une seule PR pour tous les correctifs de sécurité
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
